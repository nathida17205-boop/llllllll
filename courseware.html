<style>
:root{--bg:#fff;--ink:#1f2d3d;--teal:#1f3a5f;--sun:#dfe5ee;--card:#f1f4f8;--line:#cbd2dc;--bad:#8f4a4a;--ok:#4a7a5e}
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun",sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7}
header{background:var(--teal);color:#fff;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:1.1rem;margin:0;flex:1}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
h2{margin:.2em 0;font-size:1.25rem}h3{margin:.4em 0}
input,select,textarea,button{font:inherit;padding:8px 12px;border-radius:10px;border:2px solid var(--line);max-width:100%}
button{background:var(--sun);border-color:var(--sun);font-weight:700;cursor:pointer}
button.alt{background:#fff;border-color:var(--teal);color:var(--teal)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0}
.msg{padding:8px 12px;border-radius:10px;margin:8px 0}.msg.err{background:#f2e6e6;color:var(--bad)}.msg.ok{background:#e6efe9;color:var(--ok)}
nav{display:flex;gap:8px;flex-wrap:wrap}nav button{background:#fff;border-color:#fff}nav button.on{background:var(--sun);border-color:var(--sun)}
.q{margin:10px 0;padding:8px;background:#fff;border-radius:10px}.q label{display:block;cursor:pointer}
.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#fff;border:3px solid var(--sun)}
.hd{background:var(--teal);border-color:var(--teal)}.hd h2,.hd p{color:#fff}th{background:var(--teal);color:#fff}figcaption{font-size:.9rem;color:#52606d}pre{background:#fff;border:1px solid var(--line);padding:8px;overflow-x:auto;font-size:.8rem}.done{color:var(--ok);font-weight:700}.hide{display:none}
</style>
</head>

  app.innerHTML=`<div class="card"><h2>เข้าสู่ระบบ</h2><p>ผู้เรียน: ใช้รหัสนักเรียน 11 หลัก · ผู้สอน: ใช้อีเมล</p>
    <div class="row"><input id="id" placeholder="รหัสนักเรียน หรือ อีเมลผู้สอน" autocomplete="username" size="28"></div>
    <div class="row"><input id="pw" type="password" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัว)" autocomplete="current-password" size="28"></div>
    <div class="row"><button id="login">เข้าสู่ระบบ</button><button id="reg" class="alt">สมัครใช้งานครั้งแรก (ผู้เรียน)</button></div><div id="m"></div></div>`;
  const cred=()=>{const v=$('id').value.trim(); return {email:/^[0-9]{11}$/.test(v)?`${v}@${EMAIL_DOMAIN}`:v, password:$('pw').value};};
  $('login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword(cred()); error?msg($('m'),'เข้าสู่ระบบไม่ได้: รหัสหรือรหัสผ่านไม่ถูกต้อง','err'):boot();};
  $('reg').onclick=async()=>{ if(!/^[0-9]{11}$/.test($('id').value.trim())) return msg($('m'),'กรอกรหัสนักเรียน 11 หลัก','err');
    if($('pw').value.length<6) return msg($('m'),'รหัสผ่านต้องมีอย่างน้อย 6 ตัว','err');
    const {error}=await sb.auth.signUp(cred()); error?msg($('m'),'สมัครไม่ได้: รหัสไม่อยู่ในรายชื่อ หรือเคยสมัครแล้ว (ถามครู)','err'):boot(); };
}
$('out').onclick=async()=>{await sb.auth.signOut(); user=me=null; authView();};

async function boot(){
  const {data:{session}}=await sb.auth.getSession(); if(!session) return authView();
  user=session.user; $('out').classList.remove('hide');
  const {data:t}=await sb.from('teachers').select('user_id').eq('user_id',user.id).maybeSingle();
  if(t){ setNav([['tRes','ผลคะแนน'],['tSub','ตรวจงาน'],['tMat','สื่อการเรียน']]); return V.tRes(); }
  const {data}=await sb.from('students').select('*').eq('user_id',user.id).maybeSingle(); me=data;
  if(!me){ app.innerHTML='<div class="card msg err">บัญชีนี้ยังไม่ได้เชื่อมกับรายชื่อ กรุณาแจ้งครู</div>'; return; }
  if(me.photo_path){ const u=await signed('photos',me.photo_path); if(u){$('av').src=u;$('av').classList.remove('hide');} }
  setNav([['units','บทเรียน'],['pre','ก่อนเรียน'],['post','หลังเรียน'],['sum','สรุปผล'],['mat','สื่อเพิ่มเติม'],['prof','โปรไฟล์'],['work','ส่งงาน AR']]); V.units();
}

   d.append(`${nm[x.user_id]||'?'} · หน่วย ${x.unit} · ${x.note||''} `, x.kind==='link'?link('เปิดลิงก์',x.url):link('เปิดไฟล์',await signed('submissions',x.storage_path)));
   const row=document.createElement('div'); row.className='row';
   row.innerHTML=`<input type="number" step="0.5" min="0" placeholder="คะแนน" style="width:100px"><input placeholder="ความเห็น" size="24"><button>บันทึก</button><span></span>`;
   const [sc,cm]=row.querySelectorAll('input'); sc.value=x.score??''; cm.value=x.teacher_comment??'';
   row.querySelector('button').onclick=async()=>{const {error}=await sb.from('submissions').update({score:sc.value===''?null:+sc.value,teacher_comment:cm.value||null}).eq('id',x.id); row.querySelector('span').textContent=error?'บันทึกไม่สำเร็จ':'บันทึกแล้ว';};
   d.appendChild(row); l.appendChild(d); }
 },
 async tMat(){
  const {data}=await sb.from('materials').select('*').order('created_at',{ascending:false});
  app.innerHTML=`<div class="card"><h2>เพิ่มสื่อการเรียน</h2>
   <div class="row"><input id="t" placeholder="ชื่อสื่อ" size="28"><select id="k"><option value="file">ไฟล์ (pptx, docx, pdf ≤ 50 MB)</option><option value="link">ลิงก์</option><option value="video">วิดีโอ (ลิงก์)</option></select></div>
   <div class="row"><input id="f" type="file" accept=".pdf,.pptx,.docx"><input id="url" class="hide" placeholder="https://..." size="36"></div><button id="go">เพิ่ม</button><div id="m"></div></div>
   <div class="card"><h2>สื่อที่มี</h2><div id="l"></div></div>`;
  $('k').onchange=()=>{const f=$('k').value==='file'; $('f').classList.toggle('hide',!f); $('url').classList.toggle('hide',f);};
  $('go').onclick=async()=>{ const kind=$('k').value, title=$('t').value.trim(); if(!title) return msg($('m'),'ใส่ชื่อสื่อ','err'); const row={title,kind};
   if(kind==='file'){ const f=$('f').files[0], e=checkFile(f,MAT_TYPES,50); if(e) return msg($('m'),e,'err');
     row.storage_path=`${Date.now()}.${ext(f)}`; row.file_name=f.name; const u=await sb.storage.from('materials').upload(row.storage_path,f,{contentType:f.type}); if(u.error) return msg($('m'),'อัปโหลดไม่สำเร็จ','err'); }
   else { row.url=$('url').value.trim(); if(!isUrl(row.url)) return msg($('m'),'ลิงก์ต้องขึ้นต้นด้วย http:// หรือ https://','err'); }
   const r=await sb.from('materials').insert(row); r.error?msg($('m'),'บันทึกไม่สำเร็จ','err'):V.tMat(); };
  const l=$('l'); if(!data?.length) l.textContent='ยังไม่มีสื่อ';
  (data||[]).forEach(m=>{ const p=document.createElement('p'); const b=document.createElement('button'); b.className='alt'; b.textContent='ลบ';
   b.onclick=async()=>{ if(!confirm('ลบสื่อนี้?')) return; if(m.storage_path) await sb.storage.from('materials').remove([m.storage_path]); await sb.from('materials').delete().eq('id',m.id); V.tMat(); };
   p.append(`${m.kind} · ${m.title} `,b); l.appendChild(p); });
 }
};

const TOTAL=10;
const gain=(pre,post)=>(pre==null||post==null||pre>=TOTAL)?null:(post-pre)/(TOTAL-pre);
const setFor=k=>((k==='pre')===(+me.id.slice(-1)%2===0))?'A':'B';   // รหัสลงท้ายเลขคู่: ก่อน=A หลัง=B ; เลขคี่: ก่อน=B หลัง=A
function shrink(f){ return createImageBitmap(f).then(bm=>{ const k=Math.min(1,512/Math.max(bm.width,bm.height)), c=document.createElement('canvas'); c.width=Math.round(bm.width*k); c.height=Math.round(bm.height*k);
  c.getContext('2d').drawImage(bm,0,0,c.width,c.height); return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(),'image/jpeg',0.85)); }); }
function setupView(){ app.innerHTML='<div class="card hd"><h2>ยังไม่ได้ตั้งค่าระบบ</h2></div><div class="card"><ol><li>เปิดไฟล์ courseware.html ด้วยโปรแกรมแก้ข้อความ</li><li>ที่ต้นสคริปต์ แก้ SUPABASE_URL และ SUPABASE_ANON_KEY เป็นค่าจาก Supabase → Project Settings → API (ใช้ anon public key เท่านั้น)</li><li>บันทึกไฟล์ แล้วเปิดหน้านี้ใหม่</li></ol></div>'; }
async function test(kind){
  const name=kind==='pre'?'ก่อนเรียน':'หลังเรียน';
  const {data:all}=await sb.from('attempts').select('*').eq('user_id',user.id); const at=(all||[]).find(a=>a.kind===kind);
  if(at){ let h=`<div class="card hd"><h2>แบบทดสอบ${name}</h2><p>ทำแล้ว ได้ ${at.score}/${TOTAL} คะแนน (ทำได้ครั้งเดียว)</p></div>`;
   if(kind==='post'){ const S=SETS[at.answers?.set]||SETS[setFor('post')];
    h+=S.map((x,i)=>{ const a=at.answers?.a?.[i]; return `<div class="q"><b>${i+1}. ${esc(x[1])}</b> (หน่วยที่ ${x[0]})<br>คำตอบของท่าน: ${esc(x[2][a]??'-')} — ${a===x[3]?'ถูก':'ผิด'}<br>เฉลย: ${esc(x[2][x[3]])}<br>เหตุผล: ${esc(x[4])}</div>`; }).join(''); }
   app.innerHTML=h; return; }
  if(kind==='post'){ const {data:p}=await sb.from('progress').select('unit').eq('user_id',user.id).eq('done',true);
   if((p||[]).length<UNITS.length){ app.innerHTML='<div class="card"><h2>แบบทดสอบหลังเรียน</h2><p>เรียนให้ครบทุกหน่วยก่อน จึงจะทำแบบทดสอบนี้ได้</p></div>'; return; } }
  const key=setFor(kind), S=SETS[key];
  app.innerHTML=`<div class="card hd"><h2>แบบทดสอบ${name}</h2><p>${S.length} ข้อ ทำได้ครั้งเดียว ${kind==='pre'?'ไม่แสดงเฉลย':'แสดงเฉลยหลังส่ง'} ตอบให้ครบก่อนกดส่ง</p></div>`+
   S.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q[1])}</b>${q[2].map((c,k)=>`<label style="display:block"><input type="radio" name="q${i}" value="${k}"> ${esc(c)}</label>`).join('')}</div>`).join('')+`<button id="go">ส่งคำตอบ</button><div id="m"></div>`;
  $('go').onclick=async()=>{ const ans=S.map((q,i)=>{ const x=app.querySelector(`input[name=q${i}]:checked`); return x?+x.value:null; });
   if(ans.includes(null)) return msg($('m'),'ตอบให้ครบทุกข้อก่อนส่ง','err'); if(!confirm('ส่งแล้วแก้ไขไม่ได้ ยืนยันหรือไม่')) return;
   const score=ans.filter((a,i)=>a===S[i][3]).length;
   const {error}=await sb.from('attempts').insert({user_id:user.id,kind,score,answers:{set:key,a:ans}});
   error?msg($('m'),'บันทึกไม่สำเร็จ (อาจเคยทำชุดนี้ไปแล้ว)','err'):test(kind); };
}
CFG_MISSING?setupView():boot();
